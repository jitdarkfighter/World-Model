# Optional Atari override (Tier 3). Use only after the CartPole pipeline works:
#   python -m data.collect --config configs/atari.yaml
# Requires: pip install "gymnasium[atari]" ale-py   (ROMs are bundled with ale-py >= 0.9)
# The models are identical; only the environment and a few budgets change.

run_name: pong

env:
  type: atari
  name: ALE/Pong-v5
  frame_stack: 4
  max_steps: 1000
  clip_reward: true

data:
  train_transitions: 20000
  test_transitions: 5000

vae:
  latent_dim: 32
  beta: 0.1
  epochs: 40

dynamics:
  hidden: 512
  seq_len: 16

mpc:
  horizon: 10

dqn:
  total_steps: 300000
  replay_size: 30000
  eps_decay_steps: 100000
